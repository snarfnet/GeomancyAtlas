name: Geomancy Atlas validation
on:
  workflow_dispatch:
  push:
concurrency:
  group: geomancy-validation-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      matrix:
        device: [iphone, ipad]
    steps:
      - uses: actions/checkout@v4
      - name: Verify all charts
        run: |
          swiftc GeomancyAtlas/GeomancyModel.swift Tests/main.swift -o "$RUNNER_TEMP/tests"
          "$RUNNER_TEMP/tests"
      - name: Generate project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate

      - name: Build and capture
        env:
          DEVICE_KIND: ${{ matrix.device }}
        run: |
          mkdir -p store-shots
          xcrun simctl list devices available -j > /tmp/devices.json
          DEVICE=$(python3 -c 'import os,json; ds=[d for r,ls in json.load(open("/tmp/devices.json"))["devices"].items() if "iOS" in r for d in ls]; print(next(d["udid"] for d in ds if ("iPhone" in d["name"] and "Pro Max" in d["name"]) if os.environ["DEVICE_KIND"]=="iphone") if os.environ["DEVICE_KIND"]=="iphone" else next(d["udid"] for d in ds if "iPad Pro 13" in d["name"]))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time '9:41' --batteryState charged --batteryLevel 100
          xcodebuild -project GeomancyAtlas.xcodeproj -scheme GeomancyAtlas -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build-screenshots CODE_SIGNING_ALLOWED=NO build > store-shots/build.log 2>&1
          xcrun simctl install "$DEVICE" build-screenshots/Build/Products/Debug-iphonesimulator/GeomancyAtlas.app
          xcrun simctl launch "$DEVICE" com.tokyonasu.GeomancyAtlas --store-screenshot
          sleep 30
          xcrun simctl io "$DEVICE" screenshot "store-shots/${DEVICE_KIND}-main.png"
          xcrun simctl terminate "$DEVICE" com.tokyonasu.GeomancyAtlas
          xcrun simctl launch "$DEVICE" com.tokyonasu.GeomancyAtlas --store-builder
          sleep 4
          xcrun simctl io "$DEVICE" screenshot "store-shots/${DEVICE_KIND}-builder.png"
          xcrun simctl terminate "$DEVICE" com.tokyonasu.GeomancyAtlas
          xcrun simctl launch "$DEVICE" com.tokyonasu.GeomancyAtlas --store-japanese
          sleep 4
          xcrun simctl io "$DEVICE" screenshot "store-shots/${DEVICE_KIND}-ja.png"
          if [ "$DEVICE_KIND" = "iphone" ]; then
            xcodebuild test -project GeomancyAtlas.xcodeproj -scheme GeomancyAtlas -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build-screenshots CODE_SIGNING_ALLOWED=NO > store-shots/test.log 2>&1
            find "$HOME/Library/Developer/CoreSimulator/Devices" -type d -name atlas-artifacts -exec cp -R {} store-shots/ \;
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geomancyatlas-${{ matrix.device }}
          path: store-shots
